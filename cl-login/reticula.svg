<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMinYMin slice">
  <!-- Retícula do login Clicheart: pontos em 4 ângulos (15°, 75°, 0°, 45°), cor = degradê do logo (azul → vermelho). -->
  <defs>
    <pattern id="bC" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="4.0" cy="4.0" r="2.0" fill="#fff"/></pattern>
    <mask id="fC" maskUnits="userSpaceOnUse" x="-600" y="-600" width="2800" height="2600"><path d="M1700 -40 L1700 1000 C 820 900, 700 700, 760 480 S 640 120, 500 -40 Z" fill="#fff"/></mask>
    <pattern id="bM" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(75)"><circle cx="4.0" cy="4.0" r="1.9" fill="#fff"/></pattern>
    <mask id="fM" maskUnits="userSpaceOnUse" x="-600" y="-600" width="2800" height="2600"><path d="M1700 -40 L1700 1000 C 900 860, 560 760, 600 520 S 820 220, 660 -40 Z" fill="#fff"/></mask>
    <pattern id="bY" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(0)"><circle cx="4.0" cy="4.0" r="2.0" fill="#fff"/></pattern>
    <mask id="fY" maskUnits="userSpaceOnUse" x="-600" y="-600" width="2800" height="2600"><path d="M1700 -40 L1700 820 C 930 700, 880 520, 940 360 S 820 80, 760 -40 Z" fill="#fff"/></mask>
    <pattern id="bK" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4.0" cy="4.0" r="1.3" fill="#fff"/></pattern>
    <mask id="fK" maskUnits="userSpaceOnUse" x="-600" y="-600" width="2800" height="2600"><path d="M1700 -40 L1700 1000 C 960 900, 880 760, 900 640 S 1020 300, 900 -40 Z" fill="#fff"/></mask>
    <radialGradient id="some" cx="85%" cy="15%" r="85%"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="mk" maskUnits="userSpaceOnUse" x="-400" y="-600" width="2400" height="2600"><rect x="-400" width="2200" height="1000" fill="url(#some)"/></mask>
    <mask id="pontos" maskUnits="userSpaceOnUse" x="-600" y="-600" width="2800" height="2600">
      <g transform="matrix(-1 0 0 1 1000 0)"><g mask="url(#mk)" transform="translate(-260 0)">
        <g mask="url(#fC)" opacity="0.85"><rect x="-600" y="-600" width="2800" height="2600" fill="url(#bC)"/></g>
        <g mask="url(#fM)" opacity="0.8"><rect x="-600" y="-600" width="2800" height="2600" fill="url(#bM)"/></g>
        <g mask="url(#fY)" opacity="0.95"><rect x="-600" y="-600" width="2800" height="2600" fill="url(#bY)"/></g>
        <g mask="url(#fK)" opacity="0.9"><rect x="-600" y="-600" width="2800" height="2600" fill="url(#bK)"/></g>
      </g></g>
    </mask>
    <linearGradient id="logo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="620" y2="0"><stop offset="0" stop-color="#0B4DA2"/><stop offset=".48" stop-color="#0B4DA2"/><stop offset=".58" stop-color="#534A89"/><stop offset=".67" stop-color="#914167"/><stop offset=".75" stop-color="#CF2C3B"/><stop offset=".81" stop-color="#ED1C24"/><stop offset="1" stop-color="#ED1C24"/></linearGradient>
  </defs>
  <rect x="-600" y="-600" width="2800" height="2600" fill="url(#logo)" mask="url(#pontos)"/>
</svg>
